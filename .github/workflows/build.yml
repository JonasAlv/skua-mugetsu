# Builds Mugetsu for Linux (Wayland & X11) from source/ on GitHub's Linux machines.
#
# - Every change to source/ on main, and every pull request that changes it: test builds,
#   downloadable from the run's page.
# - Actions > Build Mugetsu > Run workflow, with "Create or update GitHub release" ticked (or a push to main):
#   publishes/updates the GitHub release with the Linux archives (x86-64-v3 as linux.tar.gz and
#   x86-64-v2 as linux-x86-64-v2.tar.gz) and their SHA-256 (notes from source/notes/<version>.md)
#   for BonxieMux.
name: Build Mugetsu

on:
  push:
    branches: [main]
    paths: ['source/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['source/**', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Create or update GitHub release'
        type: boolean
        default: true
      draft:
        description: 'Create release as draft instead of publishing immediately'
        type: boolean
        default: false

# Read-only by default (pull requests run with this); only the release job writes.
permissions:
  contents: read

jobs:
  linux:
    # The oldest supported Ubuntu runner: the program then runs on systems from about 2022 on
    # (it needs the C library of the system it was built on, or newer).
    # Two builds: x86-64-v3 (needs AVX2, linux-x86-64-v3.tar.gz) and x86-64-v2 for CPUs without AVX2
    # (with AVX, FMA and F16C, linux-x86-64-v2.tar.gz).
    name: linux${{ matrix.suffix }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: -x86-64-v3
            cpu: x86-64-v3
            features: ''
          - suffix: -x86-64-v2
            cpu: x86-64-v2
            features: +avx,+fma,+f16c
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha: ${{ steps.package.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Install libraries
        run: |
          pkgs="libasound2-dev libudev-dev libfontconfig-dev libfreetype6-dev libssl-dev"
          apt_opts="-o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          if ! (sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y --fix-missing $pkgs); then
            echo "Default Ubuntu mirror failed; falling back to archive.ubuntu.com..."
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
            sudo apt-get $apt_opts update
            sudo apt-get $apt_opts install -y --fix-missing $pkgs
          fi

      - name: Install Rust
        run: |
          version=$(tr -d '[:space:]' < source/RUST_VERSION)
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup default "$version"
          rustc --version

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            source/build/target
          key: cargo-${{ matrix.cpu }}-${{ hashFiles('source/RUST_VERSION', 'source/RUFFLE_COMMIT', 'source/patches/*.patch') }}
          restore-keys: |
            cargo-${{ matrix.cpu }}-${{ hashFiles('source/RUST_VERSION', 'source/RUFFLE_COMMIT') }}-
            cargo-${{ matrix.cpu }}-${{ hashFiles('source/RUST_VERSION') }}-

      - name: Build
        env:
          MUGETSU_TARGET_CPU: ${{ matrix.cpu }}
          MUGETSU_TARGET_FEATURES: ${{ matrix.features }}
        run: bash source/build-linux.sh

      - name: Package
        id: package
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          version=$(sed -n 's/^pub const VERSION: &str = "\([^"]*\)";.*/\1/p' source/build/ruffle/desktop/src/mugetsu.rs)
          dir=package/Mugetsu
          mkdir -p "$dir/LICENSES" release
          cp source/build/out/Mugetsu "$dir/"
          cp source/release-linux/* "$dir/"
          cp source/release/LICENSES/* "$dir/LICENSES/"
          cp LICENSE "$dir/LICENSES/Mugetsu-LICENSE-GPL-3.0.txt"
          archive="linux$SUFFIX.tar.gz"
          # A tar archive keeps the program's "executable" mark (a zip wouldn't).
          tar -C package --owner=0 --group=0 --numeric-owner -czf "release/$archive" Mugetsu
          hash=$(sha256sum "release/$archive" | cut -d' ' -f1 | tr a-f A-F)
          binHash=$(sha256sum "$dir/Mugetsu" | cut -d' ' -f1 | tr a-f A-F)
          echo "Mugetsu $version ($archive)"
          echo "archive SHA-256: $hash"
          echo "Mugetsu SHA-256: $binHash"
          if [ "$SUFFIX" = "-x86-64-v3" ]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "sha=$hash" >> "$GITHUB_OUTPUT"
          fi
          printf '## Mugetsu %s (Linux%s)\n\narchive SHA-256: `%s`\nMugetsu SHA-256: `%s`\n' "$version" "$SUFFIX" "$hash" "$binHash" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: release-linux${{ matrix.suffix }}
          path: release

  release:
    if: ${{ needs.linux.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.linux.outputs.version }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          notes="source/notes/$VERSION.md"
          if [ ! -f "$notes" ]; then echo "Missing release notes: $notes"; exit 1; fi
          test -f release/linux-x86-64-v3.tar.gz
          test -f release/linux-x86-64-v2.tar.gz
          LINUX_V3_SHA=$(sha256sum release/linux-x86-64-v3.tar.gz | cut -d' ' -f1 | tr a-f A-F)
          LINUX_V2_SHA=$(sha256sum release/linux-x86-64-v2.tar.gz | cut -d' ' -f1 | tr a-f A-F)
          sed -e "s/LINUX_V3_SHA_PLACEHOLDER/$LINUX_V3_SHA/g" \
              -e "s/LINUX_SHA_PLACEHOLDER/$LINUX_V3_SHA/g" \
              -e "s/LINUX_V2_SHA_PLACEHOLDER/$LINUX_V2_SHA/g" "$notes" > notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" release/* --clobber
            gh release edit "v$VERSION" --notes-file notes.md
          else
            draft_flag=""
            if [ "$DRAFT" = "true" ]; then draft_flag="--draft"; fi
            gh release create "v$VERSION" release/* $draft_flag --title "Mugetsu $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
